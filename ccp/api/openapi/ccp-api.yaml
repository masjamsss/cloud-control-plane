  # than implemented: an unscoped catalog read is exactly the estate surface the
  # `@control` scope rule forbids (see securitySchemes.session — "every estate-only
  # surface (request submission/approval, catalog reads) refuses it with 403
  # CONTROL_SCOPE"), so implementing them would have contradicted the security model.
  # test/openapi.test.ts now diffs this file against the live Hono route table in BOTH
