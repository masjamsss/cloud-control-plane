  /projects/{id}/data:
    put: { summary: 'The token-authed CI data upload — `Authorization: Bearer <tokenId>.<secret>` (an upload
        token, NEVER a session; this lane is the account''s CI). Stages the bundle as the next immutable
        VERSION on the api host''s disk; nothing is served until the separate dual-controlled activate.
        FAIL-CLOSED pipeline: per-tokenId rate limit (small burst, slow refill) BEFORE the token-hash
        verify (429 RATE_LIMITED, Retry-After set) → explicit size cap (16 MiB) before parsing → strict
        schema → sha256 digests recomputed server-side over the CANONICAL JSON of each part and compared
        with the claim (422 DATA_DIGEST_MISMATCH) → server-side redaction re-run over blocks, inventory
        attributes AND manifests (the stored copy is the server''s own redaction output; masked-here values
        surface as warnings). Audit: project-data-upload',
      security: [],
      parameters: [{ $ref: '#/components/parameters/id' }],
      requestBody: { required: true, content: { application/json: { schema: { type: object,
        required: [digests, inventory, blocks], additionalProperties: false,
        properties: { digests: {$ref: '#/components/schemas/ProjectDataDigests'},
          inventory: { type: object, required: [generatedAt, resources], additionalProperties: false,
            properties: { generatedAt: {type: [string, 'null']}, sourceCommit: {type: [string, 'null']}, source: {type: string},
              resources: {type: array, items: {type: object}} } },
          blocks: { type: object, required: [index, chunks], additionalProperties: false,
            properties: { index: {type: object, additionalProperties: {type: string}, description: 'address → chunk file base'},
              chunks: {type: object, description: 'chunk file base → {address → {file,line,source,viewOnly?}}'} } },
          manifests: {type: array, items: {type: object}, description: 'raw service-manifest JSONs (validated against the app manifest schema)'},
          summary: { type: object, additionalProperties: false,
            properties: { providerPins: {type: object, additionalProperties: {type: string}} } } } } } } },
      responses: { '201': { description: 'Staged (NOT served) as the next version', content: { application/json: { schema: { type: object,
          required: [version, status, digests, uploadDigests, warnings],
          properties: { version: {type: integer}, status: {type: string, enum: [staged]},
            digests: {$ref: '#/components/schemas/ProjectDataDigests'},
            uploadDigests: {$ref: '#/components/schemas/ProjectDataDigests'},
            warnings: {type: array, items: {type: string}} } } } } },
        '401': { description: UPLOAD_TOKEN_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '404': { description: Not found }, '409': { $ref: '#/components/responses/E409' },
        '413': { description: UPLOAD_TOO_LARGE, content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '422': { description: 'VALIDATION_FAILED | DATA_DIGEST_MISMATCH', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '429': { $ref: '#/components/responses/E429' } } }
    get: { summary: 'List a project''s uploaded data versions, staged + active (lead + isAdmin)',
      parameters: [{ $ref: '#/components/parameters/id' }],
