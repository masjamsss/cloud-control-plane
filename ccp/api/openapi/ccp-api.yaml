  /admin/settings:
    get: { summary: All settings, responses: { '200': { description: OK } } }
  /admin/settings/{key}:
    put: { summary: Put a setting (freeze on / allowlist narrow apply now; freeze off / allowlist widen → 202),
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }],
      responses: { '200': { description: Applied }, '202': { description: Pending }, '422': { $ref: '#/components/responses/E422' } } }
  # DOC-2: the portal-managed deployment settings pair — shipped, and absent from this
  # contract until now (the parity test did not catch it because it only asserted that a
  # hand-written list of strings was PRESENT, never that the served surface was covered).
  /admin/deployment:
    get:
      summary: 'Every knob the server reads, on one screen — including the ones the portal CANNOT edit,
        each carrying a plain sentence about why and what to do instead, so an operator never has to open
        a config file to SEE how the deployment is set up. Deployment settings are GLOBAL: they are stored
        and read on the reserved control scope regardless of which project the admin is looking at.
        SECRETS NEVER CARRY A VALUE here — only `configured: true|false` — so this response is safe to put
        in a screenshot or a bug report.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [settings],
          properties: { settings: { type: array, items: { $ref: '#/components/schemas/DeploymentKnob' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /admin/deployment/{id}:
    put:
      summary: 'Set one knob. THE GATE: a knob is writable here only if the registry says so — the
        command-running knobs and the store''s own keys are refused 422 OP_DISABLED by the same check that
        carries the reason and the `instead`, so the refusal can never drift from its explanation. The value
        is shape-checked against the knob''s own kind, so a string "false" can never land on a toggle and
        read as truthy later.
        LOOSENING IS DUAL-CONTROLLED: arming the scanner, widening the host allowlist, or lifting the apply
        freeze all widen what this deployment may do, so they are PROPOSED (202, second admin required).
        Tightening applies at once (200) — a safety brake must never wait. Audited as
        deployment-setting-change.'
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [value],
        properties: { value: { description: 'boolean for a toggle, finite number for a number, array of strings for a list, string otherwise' } } } } } }
      responses:
        '200': { description: 'Applied immediately (tightening)', content: { application/json: { schema: { type: object,
          required: [ok, id, value], properties: { ok: {type: boolean, const: true}, id: {type: string}, value: {} } } } } }
        '202': { description: 'Proposed (loosening) — awaits a second distinct admin''s ack',
          content: { application/json: { schema: { $ref: '#/components/schemas/PendingConfigChange' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { description: 'NOT_FOUND — no such setting', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } }
        '422': { description: 'OP_DISABLED (not portal-editable; details carry `problem` + `instead`) | VALIDATION_FAILED (missing `value`, or wrong shape for the knob kind)',
          content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } }
  /admin/catalog/{opId}:
    put: { summary: Enable/disable an operation (disable now; re-enable → 202). Disabled ops 422 at submit,
      parameters: [{ name: opId, in: path, required: true, schema: { type: string } }],
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled],
        properties: { enabled: {type: boolean} } } } } },
      responses: { '200': { description: Applied }, '202': { description: Pending } } }
  /admin/config-changes:
    get: { summary: 'Dual-control items AWAITING a second admin. Unpaged, and bounded by construction rather
        than by a page size: ack, reject and expiry each clear the row GSI1PK, so this partition only ever holds
        proposals that are still open. (It previously also declared a cursor parameter, which nothing implemented
        and which the bare-array response has nowhere to return.)',
      responses: { '200': { description: OK, content: { application/json: { schema: { type: array,
        items: { $ref: '#/components/schemas/PendingConfigChange' } } } } } } }
  /admin/config-changes/{id}/ack:
    post: { summary: Second DISTINCT admin applies the change (proposer acking own → 403),
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }],
      responses: { '200': { description: Applied }, '403': { $ref: '#/components/responses/E403' },
        '409': { $ref: '#/components/responses/E409' } } }
  /admin/config-changes/{id}/reject:
    post: { summary: Any admin (incl. proposer) withdraws/rejects, parameters: [{ $ref: '#/components/parameters/id' }],
      responses: { '200': { description: Rejected } } }
  /admin/audit:
    # DOC-16: was described as "uncapped" declaring only `cursor` — the handler (admin.ts)
    # actually pages: `?limit=` defaults to 100, capped at 1000; unset `cursor` starts from
    # the newest entry.
    get: { summary: Hash-chained audit, newest first, cursor-paged (limit default 100, max 1000),
      parameters: [{ $ref: '#/components/parameters/cursor' },
        { name: limit, in: query, description: 'Page size, default 100, max 1000 (unlike the /requests limit param, omitting this does NOT return the whole collection).', schema: { type: integer, minimum: 1, maximum: 1000 } }],
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object,
        properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }, cursor: {type: string} } } } } } } }
  # DOC-2: shipped (admin.ts) and declared in no contract until now.
  /admin/audit/export:
    get:
      summary: 'The WHOLE chain for the acting project as a self-verifying evidence document — chronological
        (the reverse of GET /admin/audit), head-checked, uncapped and uncursored. Served as a download
        (Content-Disposition: attachment; filename="ccp-audit-<projectId>.json"). Admin capability +
        project membership, like every /admin route. `verified` is recomputed at export time, so a
        tampered file fails verification in the reader''s hands rather than carrying a stored claim.'
      responses:
        '200': { description: OK, headers: { Content-Disposition: { schema: {type: string},
            description: 'attachment; filename="ccp-audit-<projectId>.json"' } },
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditExport' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /admin/migrate/v1:
    post: { summary: One-shot import of the SPA's localStorage v1 stores (§9); only while the backend is empty,
      parameters: [{ $ref: '#/components/parameters/client' }],
      responses: { '200': { description: Import report }, '409': { description: Backend not empty },
        '422': { $ref: '#/components/responses/E422' } } }
  /projects:
    get: { summary: 'The projects registry (0033 §3.2) — any bound session, TWO-TIER response (security review:
        least disclosure). A lead+isAdmin caller (the manage tier, same as register/trust/deregister) receives the
        rich Project — createdBy/createdAt plus the trustRequest block (parsed report, findings with file+line,
        uploadedBy) and artifacts. Every OTHER bound session receives ONLY the ProjectSummary
        ({id, name, github, accountId, region, status, trust?} — the documented any-session projection), so a
        plain requester can never read another project''s prescan findings, uploader, or artifact digests. The
        raw uploaded bytes (rawReport) never serialize on either tier',
      responses: { '200': { description: 'Array of Project (lead+isAdmin) or ProjectSummary (every other session)',
        content: { application/json: { schema: { type: array, items: { oneOf: [
          { $ref: '#/components/schemas/Project' }, { $ref: '#/components/schemas/ProjectSummary' } ] } } } } },
        '401': { $ref: '#/components/responses/E401' } } }
    post: { summary: 'Register a draft project (lead + isAdmin, ADR-0011). Strict body — status/trust/artifacts
        can never be smuggled in (mass-assignment refused whole). Registering grants NOTHING: a draft is not
        routable and not a valid account binding. Audit: project-register',
      parameters: [{ $ref: '#/components/parameters/client' }],
      requestBody: { required: true, content: { application/json: { schema: { type: object,
        required: [id, name], additionalProperties: false,
        description: 'send exactly ONE repo shape — the legacy github pair OR the host-agnostic repo (both is 422).
          IDENTITY IS OPTIONAL (0033 decision 5, the url-only register): a body carrying NO identity key at all
          DEFERS it — the scan proposes provider/region (and statically-present account ids) with file:line
          provenance and an admin confirms them through PUT /projects/{id}/identity. Such a project scans and
          reaches trust review normally but can never mint an upload token (422 IDENTITY_UNCONFIRMED) until a
          human has confirmed, so the deferral moves WHEN identity is decided, never WHETHER a person decides it.
          A body carrying ANY identity key must carry a COMPLETE, unmixed one — half an identity is a mistake,
          not a deferral. PROVIDER-DISCRIMINATED (0039 S1): provider absent/''aws'' requires accountId+region and
          refuses the azure fields; provider ''azure'' requires subscriptionId+tenantId+location and refuses
          accountId/region',
        properties: { id: {type: string, pattern: '^[a-z][a-z0-9-]{1,31}$'}, name: {type: string, minLength: 2, maxLength: 100},
          github: {type: object, required: [owner, repo], additionalProperties: false,
            properties: { owner: {type: string}, repo: {type: string} }},
          repo: {$ref: '#/components/schemas/RepoRef'},
          provider: {type: string, enum: [aws, azure, gcp], description: 'absent = aws (the wire convention — an aws body omits it)'},
          accountId: {type: string, pattern: '^\d{12}$'}, region: {type: string},
          subscriptionId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'},
          tenantId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'},
          location: {type: string, description: 'Azure location (explicit allowlist, routes/projects.ts AZURE_LOCATION_ALLOWLIST)'},
          gcpProjectId: {type: string, pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$', description: 'GCP project id (ADR-0034 G1) — required iff provider is gcp'},
          gcpRegion: {type: string, description: 'GCP region (explicit allowlist, routes/projects.ts GCP_REGION_ALLOWLIST) — required iff provider is gcp'} } } } } },
      responses: { '201': { description: Draft registered, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '409': { description: DUPLICATE_PROJECT, content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '422': { $ref: '#/components/responses/E422' } } }
  /projects/{id}/trust-request:
    put: { summary: 'Upload the local `catalogctl onboard` run''s artifact pair (lead): the trust-request.json
        triple {repo, commitSha, prescanSha256} — the REAL schema the CLI writes — plus the RAW
        prescan-report.json text. THE BINDING IS VERIFIED SERVER-SIDE: sha256(prescanReport bytes) must equal
        trustRequest.prescanSha256 (else 422 PRESCAN_SHA_MISMATCH), then the bytes must strictly parse as a
        PrescanReport whose repo matches. A reject-verdict report uploads fine — findings must persist for
        human review — it just can never be trusted. Status → pending-trust; refused (409) once trusted/ready
        (re-aiming a recorded trust decision requires deregister + fresh onboard). ALSO accepts a PRE-TRUST
        onboard-token Bearer lane (`Authorization: Bearer <tokenId>.<secret>`, minted by
        POST /projects/{id}/onboard-tokens) for the one-shot CI scan — no session, no X-Ccp-Client, like
        PUT /projects/{id}/data. Same downstream pipeline, but its OWN fail-closed gate runs FIRST (per-tokenId
        rate limit → store lookup → project binding → not-revoked → expiry → argon2id verify → status); a
        revoked/expired/mismatched token is refused 401 ONBOARD_TOKEN_INVALID. On that lane uploadedBy records
        `onboard-token:<tokenId>` and the write audits to the TARGET project''s chain; an optional `ci` provenance
        block is stored for the trust review. The two-admin trust on POST /projects/{id}/trust is UNCHANGED.
        Audit: project-trust-request',
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }],
      requestBody: { required: true, content: { application/json: { schema: { type: object,
        required: [trustRequest, prescanReport], additionalProperties: false,
        properties: { trustRequest: { type: object, required: [repo, commitSha, prescanSha256], additionalProperties: false,
            properties: { repo: {type: string}, commitSha: {type: string, pattern: '^[0-9a-f]{7,64}$'},
              prescanSha256: {type: string, pattern: '^[a-f0-9]{64}$'} } },
          prescanReport: {type: string, maxLength: 524288, description: 'raw prescan-report.json file text — hashed byte-for-byte'},
          ci: { type: object, additionalProperties: false, required: [host, runUrl], description: 'OPTIONAL CI-run provenance (spec §3 A-iii) — rendered in the trust review so admins can cross-check the forge log; omitted → treated as absent, malformed → whole body refused',
            properties: { host: {type: string, enum: [github, gitlab]}, runUrl: {type: string, format: uri, description: 'https-only, ≤500 chars'} } } } } } } },
      responses: { '200': { description: Artifacts recorded; pending-trust, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: Not found }, '409': { $ref: '#/components/responses/E409' },
        '422': { description: 'VALIDATION_FAILED | PRESCAN_SHA_MISMATCH', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } } } }
  /projects/{id}/onboard-tokens:
    post: { summary: 'Mint a PRE-TRUST onboarding token (lead + isAdmin) — a SEPARATE, narrower credential from the
        CI upload token, never cross-usable (own type + key namespace). Valid ONLY while the project is
        draft/pending-trust — the EXACT INVERSE of the upload token''s trusted/ready gate, so the two credentials''
        lifetimes never overlap — refused (409) once trusted/ready, and for an archived project. Authorizes
        EXACTLY one verb: the Bearer lane of PUT /projects/{id}/trust-request. The clear token
        (`<tokenId>.<secret>`) is returned exactly ONCE — the server stores only an argon2id hash. Expiring
        (default 24h, max 7 days) and revocable. Audit: onboard-token-mint',
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }],
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false,
        properties: { ttlMinutes: {type: integer, minimum: 5, maximum: 10080} } } } } },
      responses: { '201': { description: 'Token minted (shown once)', content: { application/json: { schema: { type: object,
          required: [tokenId, token, expiresAt],
          properties: { tokenId: {type: string}, token: {type: string}, expiresAt: {type: string} } } } } },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: Not found }, '409': { $ref: '#/components/responses/E409' },
        '422': { $ref: '#/components/responses/E422' } } }
  /projects/{id}/onboard-tokens/{tokenId}:
    delete: { summary: 'Revoke a pre-trust onboarding token (lead + isAdmin) — immediate. UNLIKE the upload
        token''s hard-delete, the row is TOMBSTONED (`revokedAt` stamped, kept for audit — mirrors the project''s
        own `archived` block); the trust-request Bearer lane checks `revokedAt` as its own explicit fail-closed
        step. Already-revoked or unknown → 404. Audit: onboard-token-revoke',
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' },
        { name: tokenId, in: path, required: true, schema: {type: string} }],
      responses: { '200': { description: Revoked },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: Not found } } }
  /projects/{id}/forge-credential:
    put: { summary: 'Store the READ-ONLY forge token that lets the built-in scanner clone a PRIVATE repository
        (lead + isAdmin, 0033 decision 1). For GitLab, a self-hosted forge, or a github.com operator who cannot
        install the App. The {username, token} pair is sealed AES-256-GCM under CCP_FORGE_SEAL_KEY the moment it
        arrives — a key deliberately separate from the TOTP key — and stored on its OWN row, never on the project
        row that every registry read serializes. NOTHING EVER READS IT BACK: this route''s own response returns
        only the username, the registry exposes only that a credential exists, and the audit entry records the
        username and the actor but never the token. The sealed blob is opened exactly once per scan job, in
        memory, at claim time. Refused 422 FORGE_CREDENTIAL_REFUSED when the deployment has no seal key — a
        secret sealed under a guessable default is worse than refusing to store one. Replacing simply overwrites,
        so a rotated token needs no delete first. Audit: forge-credential-set',
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }],
      requestBody: { required: true, content: { application/json: { schema: { type: object,
        required: [username, token], additionalProperties: false,
        properties: { username: {type: string, minLength: 1, maxLength: 100, pattern: '^[^:\\s]+$',
            description: 'no colon — the pair is joined on the first colon for the git Basic header'},
          token: {type: string, minLength: 8, maxLength: 500, description: 'a READ-ONLY project/deploy token; never returned by any endpoint'} } } } } },
      responses: { '200': { description: 'Stored (the username only — never the token)', content: { application/json: { schema: { type: object,
          required: [username], properties: { username: {type: string} } } } } },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: Not found }, '409': { $ref: '#/components/responses/E409' },
        '422': { description: 'VALIDATION_FAILED | FORGE_CREDENTIAL_REFUSED', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } } } }
    delete: { summary: 'Remove the stored forge credential (lead + isAdmin). A HARD delete, unlike the onboarding
        token''s tombstone: there is nothing about a removed forge secret worth keeping, and retaining the sealed
        blob after the operator asked for its removal would be the opposite of what they asked for — the audit row
        is the record that it existed. Audit: forge-credential-remove',
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }],
      responses: { '200': { description: Removed },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: Not found } } }
  /projects/{id}/scan-jobs:
    post: { summary: 'Ask the CONTROL PLANE to scan this project''s repository itself (lead + isAdmin, ADR-0033) —
        the zero-touch first import: no CI file in the estate repo, no local run. Records the INTENT only; an
        isolated worker container does the cloning and parsing and uploads the SAME artifact pair over the SAME
        pre-trust onboard-token lane, so the two-admin trust ceremony is untouched. OFF BY DEFAULT: refused 409
        SCANNER_DISABLED unless the deployment set CCP_SCANNER=1 with a ≥32-char CCP_SCANNER_KEY — checked FIRST,
        so a disabled deployment discloses nothing about the project. Then, in order: past the pre-trust window or
        archived → 409; the repo host is not one this deployment may clone → 422 SCAN_TARGET_REFUSED (validated at
        creation so the operator learns immediately, and rebuilt again at claim time — the URL is never stored);
        a job already in flight for this project → 409 (one at a time, so a repeated click cannot fan out clones).
        Audit: scan-job-create',
      parameters: [{ $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/client' }],
      responses: { '201': { description: Queued, content: { application/json: { schema: { type: object,
          required: [jobId, status], properties: { jobId: {type: string}, status: {type: string, enum: [queued]} } } } } },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: Not found },
        '409': { description: 'SCANNER_DISABLED | STATE_CONFLICT', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '422': { description: 'SCAN_TARGET_REFUSED', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } } } }
  /projects/{id}/scan-jobs/latest:
    get: { summary: 'The wizard''s progress read (lead + isAdmin) — the most recent scan job only. `error` is
        already sanitized at write time, and the projection deliberately carries NO clone URL and NO token, so it
        cannot disclose how the deployment reaches the forge.',
      parameters: [{ $ref: '#/components/parameters/id' }],
      responses: { '200': { description: Latest job, content: { application/json: { schema: { type: object,
          required: [jobId, status, createdAt],
          properties: { jobId: {type: string}, status: { type: string, enum: [queued, claimed, cloning, scanning, uploaded, failed] },
            createdAt: {type: string}, startedAt: {type: string}, finishedAt: {type: string},
            error: {type: string, maxLength: 500} } } } } },
        '401': { $ref: '#/components/responses/E401' }, '403': { $ref: '#/components/responses/E403' },
        '404': { description: No scan job } } }
  /scan-jobs/claim:
    post: { summary: 'THE SCANNER WORKER LANE (ADR-0033) — "give me the next repository to scan". A MACHINE lane:
        no cookie, no session, no X-Ccp-Client; the worker presents the deployment''s shared CCP_SCANNER_KEY as
        `Authorization: Bearer <key>` (timing-safe compare, BEFORE any store read). Mounted OUTSIDE /projects so
        it inherits no session/membership middleware. THE WORKER NEVER CHOOSES ITS TARGET: it cannot name a
        project, a job, or a URL — the server picks the oldest queued job and rebuilds the clone URL server-side
        from the stored repo ref through the forge-host allowlist (that is the SSRF answer). The claim is a
        compare-and-swap on status=queued that simultaneously moves the row out of the queue index, so two workers
        can never both win. The lifecycle window is RE-CHECKED here: a project that left pre-trust (or was
        archived) since queueing has its job failed instead of scanned. The response carries a freshly minted,
        60-minute PRE-TRUST onboarding token authorizing exactly one verb — PUT /projects/{id}/trust-request —
        minted LAST, so a job that was never going to run produces no credential at all. 204 when idle.
        Audit: scan-job-claim',
      responses: { '200': { description: Work packet, content: { application/json: { schema: { type: object,
          required: [jobId, projectId, cloneUrl, onboardToken, tokenExpiresAt],
          properties: { jobId: {type: string}, projectId: {type: string},
            cloneUrl: {type: string, description: 'server-built https URL — an allowlisted forge host, never worker input'},
            onboardToken: {type: string, description: '`<tokenId>.<secret>`, shown once'},
            tokenExpiresAt: {type: string},
            cloneAuthHeader: {type: string, description: 'ONLY for a private repo (absent for a public one): the ready-to-use Authorization header value — a per-job GitHub App installation token (one repository, <=1h, contents:read) or the operator''s sealed forge token, opened here. The server assembles the scheme and encoding so the worker never parses a credential, and the worker passes it to git through the ENVIRONMENT, never argv (readable via ps) and never the URL (written into .git/config and echoed in git''s errors)'} } } } } },
        '204': { description: Nothing queued },
        '401': { description: SCANNER_KEY_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '403': { description: 'MISSING_CLIENT_HEADER — the CSRF exemption is Bearer-shaped-only; a call with no Bearer stays under the browser rules', content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } },
        '409': { description: SCANNER_DISABLED, content: { application/json: { schema: { $ref: '#/components/schemas/Err' } } } } } }
  /scan-jobs/{jobId}/status:
    post: { summary: 'The scanner worker reports progress (same CCP_SCANNER_KEY Bearer lane). NOTHING THE WORKER
        SAYS IS TRUSTED: the transition is validated against the STORED status, never the one the worker claims to
        be leaving, and it is strictly forward-only (queued→claimed→cloning→scanning→uploaded, any state→failed) —
        a terminal job can never be reopened (409 STATE_CONFLICT). The job row is keyed by (projectId, jobId), so
        naming the wrong project simply 404s. `error` is untrusted output from a process that just ran against a
        hostile repository: control characters, URLs and token-shaped strings are redacted and it is truncated to
        500 chars before storage. Audit: scan-job-status',
      parameters: [{ name: jobId, in: path, required: true, schema: {type: string} }],
      requestBody: { required: true, content: { application/json: { schema: { type: object,
        required: [projectId, status], additionalProperties: false,
        properties: { projectId: {type: string}, status: { type: string, enum: [queued, claimed, cloning, scanning, uploaded, failed] },
