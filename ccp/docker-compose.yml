# One-command bring-up of the REAL (non-demo) Cloud Control Plane: the ccp-api backend
# (durable store bind-mounted from /data/ccp/store) + the SPA built in authoritative/api mode.
#
#   cp .env.example .env   &&   edit .env      # set the secrets + public URLs
#   docker compose up -d --build               # first boot: see docs/go-live.md
#
# ── TLS / REVERSE PROXY (read this) ──────────────────────────────────────────
# Neither service terminates TLS. Per api/src/deploy.ts the api speaks PLAIN HTTP
# and its Secure session cookie is env-driven — an EXTERNAL reverse proxy
# (nginx / Caddy / Traefik / ALB) that you run IN FRONT of this stack terminates
# HTTPS. That proxy MUST:
#   • terminate HTTPS for the app's public host;
#   • forward browser page loads to the `app` service (static SPA, :8800);
#   • forward the api's public URL (VITE_API_BASE) to the `api` service (:8801),
#     preserving the Origin header so credentialed CORS works.
# The browser must ONLY ever speak HTTPS to the proxy, so the Secure cookie is sent.
#
# ── Two supported topologies (pick one in .env; see docs/go-live.md) ──────────
#   A) SAME-ORIGIN  — proxy serves the SPA at https://HOST/ and routes
#      https://HOST/api/* → api.  VITE_API_BASE=https://HOST/api, CCP_SAME_ORIGIN=1.
#   B) SPLIT-ORIGIN — SPA at https://HOST, api at https://api.HOST.
#      VITE_API_BASE=https://api.HOST, CCP_CORS_ORIGIN=https://HOST,
#      CCP_COOKIE_SAMESITE=None.

name: ccp

# OPS-10 — every service used the default json-file driver with no max-size/
# max-file, so container logs (the runner in particular relays whole CI job
# logs) could grow unbounded on the host's /docker partition. One shared cap,
# applied to every service below (`logging: *default-logging`).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # api + app carry NO `profiles:` key — they are the implicit "core" profile, so
  # the bare `docker compose up -d --build` used by install.sh and self-update.sh
  # keeps working on every existing host with zero flag changes. `runner` and
  # `toolbox` below are opt-in via `--profile` / COMPOSE_PROFILES (.env.example).
  api:
    build:
      context: .                 # ccp/ — the api image vendors the app/src slice
      dockerfile: api/Dockerfile  # it resolves at runtime (see api/Dockerfile header)
    image: ccp-api:local
    restart: unless-stopped
    logging: *default-logging
    # ERR-8 / OPS-8 — the api drains on SIGTERM instead of being hard-killed.
    #
    # `init: true` puts a real init (tini) at PID 1, which does two things this container
    # needs. It reaps orphaned processes — the armed lanes spawn `docker run` children from
    # inside this container, and a node at PID 1 does not reap grandchildren it never
    # adopted. And it forwards SIGTERM to the api unchanged. The Dockerfile CMD already
    # makes node the direct child, so this is belt-and-braces rather than the fix itself:
    # an operator running the image with plain `docker run` gets correct signal handling
    # from the CMD alone.
    init: true
    # MUST stay ABOVE src/shutdown.ts's DEFAULT_DRAIN_MS (15s). Docker's default is 10s,
    # which is BELOW the drain budget — the process would be SIGKILLed part-way through
    # its own shutdown, which is the failure the drain exists to prevent. The order is the
    # invariant: the api cuts its own connections and exits first, and this is only the
    # backstop for a process that ignored its own deadline.
    stop_grace_period: 30s
    # OPS-10 — no service had a memory ceiling; a spike in any one container
    # could OOM the host that also holds the governance store. Override via
    # CCP_API_MEM_LIMIT in .env if 1g is wrong for your estate's size.
    mem_limit: ${CCP_API_MEM_LIMIT:-1g}
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8801}
      CCP_DATA_DIR: /var/lib/ccp            # matches the mounted volume below
      # ── operator-provided / secrets (from .env) ──
      CCP_TOTP_KEY: ${CCP_TOTP_KEY:?set CCP_TOTP_KEY in .env — see .env.example}
      CCP_SECURE_COOKIES: ${CCP_SECURE_COOKIES:-1}
      CCP_COOKIE_SAMESITE: ${CCP_COOKIE_SAMESITE:-Lax}
      CCP_CORS_ORIGIN: ${CCP_CORS_ORIGIN:-}
      CCP_SAME_ORIGIN: ${CCP_SAME_ORIGIN:-}
      # First boot ONLY — seeds the admin + prints a one-time password, then MUST be
      # unset. It is refused (container exits 1) once the store exists. See go-live.md.
      CCP_BOOTSTRAP: ${CCP_BOOTSTRAP:-}
      # ADR-0023 — read ONLY during that same first boot, to seed the runtime
      # instance-identity store item (empty ⇒ the generic default; a later
      # Settings rename never needs this knob touched again).
      CCP_INSTANCE_NAME: ${CCP_INSTANCE_NAME:-}
      CCP_INSTANCE_TAGLINE: ${CCP_INSTANCE_TAGLINE:-}
      # ADR-0033 — the built-in repository scanner. BOTH must be set for the
      # lane to open (an armed scanner with no key is a closed lane, not an
      # open one); empty ⇒ every scan endpoint answers SCANNER_DISABLED and the
      # `scanner` service below has nothing to claim. CCP_FORGE_HOSTS adds
      # self-hosted forge hostnames to the clone allowlist (github.com and
      # gitlab.com are always allowed).
      CCP_SCANNER: ${CCP_SCANNER:-}
      CCP_SCANNER_KEY: ${CCP_SCANNER_KEY:-}
      CCP_FORGE_HOSTS: ${CCP_FORGE_HOSTS:-}
      # PRIVATE repositories. Only the API holds these — the scanner container
      # gets a resolved, per-job credential and never the App key or the seal.
      # Empty ⇒ public repos only, which is a working deployment, not a broken one.
      CCP_FORGE_SEAL_KEY: ${CCP_FORGE_SEAL_KEY:-}
      CCP_GITHUB_APP_ID: ${CCP_GITHUB_APP_ID:-}
      CCP_GITHUB_APP_KEY_FILE: ${CCP_GITHUB_APP_KEY_FILE:-}
      # DOC-9: the inline alternative to CCP_GITHUB_APP_KEY_FILE above, for a host
      # with no secret-mount story — read by forgeCredentials.ts#githubAppConfig,
      # unused (the file wins) whenever CCP_GITHUB_APP_KEY_FILE is also set.
      CCP_GITHUB_APP_KEY: ${CCP_GITHUB_APP_KEY:-}
    volumes:
      # The GitHub App's private key, when one is configured — a read-only bind
      # of a host file so it keeps its own permissions and never enters the
      # image or the store. Points at ${CCP_GITHUB_APP_KEY_FILE} inside the
      # container; leave the host path empty and this is an inert empty dir.
      - ${CCP_GITHUB_APP_KEY_HOST_DIR:-/data/ccp/forge}:/run/secrets/forge:ro
      # DURABLE store: accounts, TOTP, audit chain. Bind (not a named volume) —
      # created + chowned by `scripts/setup.sh data`; an existing host on the old
      # named volume migrates via `scripts/migrate-data.sh`.
      - /data/ccp/store:/var/lib/ccp
    ports:
      # Loopback-only: only a same-host reverse proxy reaches it. Do NOT expose the
      # api raw to the internet. Adjust the bind address for your proxy's network.
      - "127.0.0.1:${PORT:-8801}:${PORT:-8801}"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time → REAL mode. Empty ⇒ demo/mock SPA, so
        # this is required for a real deploy. Rebuild (--build) to change it.
        VITE_API_BASE: ${VITE_API_BASE:?set VITE_API_BASE in .env — the api's public URL}
        # ADR-0023 — the SAME CCP_INSTANCE_NAME/TAGLINE the api reads above,
        # baked as the SPA's generic-default fallback (empty ⇒ "Cloud Control
        # Plane"). A later Settings rename repaints instantly without a
        # rebuild; this only converges the BAKED layer at the next rebuild.
        VITE_INSTANCE_NAME: ${CCP_INSTANCE_NAME:-}
        VITE_INSTANCE_TAGLINE: ${CCP_INSTANCE_TAGLINE:-}
    image: ccp-app:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api                       # start ordering only; the SPA is static and needs no live api to serve
    ports:
      - "127.0.0.1:${APP_PORT:-8800}:8080"

  # ── CI runner (opt-in, profile: runner) ──────────────────────────────────────
  # Self-hosted GitHub Actions runner for this repo. Every workflow EXCEPT the two
  # that build Docker images (docker-build.yml, release-images.yml — pinned to
  # ubuntu-latest on purpose, see either file's own header) already says
  # `runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}`, so bringing this online
  # with label `ccp` + setting the repo variable CI_RUNNER=ccp is the whole
  # cutover for those (rollback: delete the variable) — see ccp/docs/go-live.md →
  # "CI runner". No docker socket (verified: no workflow ROUTED TO THIS RUNNER
  # uses docker — the two that do are never routed here), no published ports,
  # unprivileged user (see runner/Dockerfile + entrypoint.sh).
  runner:
    build: { context: ./runner }
    image: ccp-runner:local
    profiles: ["runner"]
    restart: unless-stopped
    logging: *default-logging
    # OPS-10 — the runner relays entire CI job logs and can run arbitrarily
    # memory-hungry builds; override via CCP_RUNNER_MEM_LIMIT if 4g is wrong.
    mem_limit: ${CCP_RUNNER_MEM_LIMIT:-4g}
    stop_grace_period: 2m          # let an in-flight CI job wind down
    environment:
      RUNNER_REPO_URL: ${RUNNER_REPO_URL:-}   # e.g. https://github.com/<owner>/<repo>
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}         # ephemeral registration token — NEVER stored in .env
      RUNNER_NAME: ${RUNNER_NAME:-}           # default in entrypoint: ccp-<hostname>
      RUNNER_LABELS: ${RUNNER_LABELS:-ccp}
    volumes:
      - /data/runner:/runner
    healthcheck:
      test: ["CMD", "pgrep", "-f", "Runner.Listener"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Repository scanner (opt-in, profile: scanner) ────────────────────────────
  # ADR-0033 — the zero-touch first import: the operator pastes a repo URL and
  # THIS container does the scan, instead of the estate repo running a CI job or
  # someone running catalogctl on a laptop.
  #
  # OFF unless you opt in TWICE, on purpose: the api only accepts scan jobs with
  # CCP_SCANNER=1 + CCP_SCANNER_KEY set on the `api` service, and this container
  # only runs under `--profile scanner`. Arming it is what gives this deployment
  # read access to estate repositories, so it is never a side effect of `up`.
  #
  # It is the only service that fetches untrusted code, hence the posture:
  # no ports, no volumes, no docker socket, read-only rootfs, non-root, all
  # capabilities dropped, and a tmpfs workspace that both bounds how much disk a
  # hostile repository can consume and guarantees no checkout survives a restart.
  # The image ships NO terraform and the worker refuses to start if it finds any
  # (see scanner/Dockerfile).
  #
  #   docker compose --profile scanner up -d --build scanner
  scanner:
    build:
      context: ..                       # repo root — builds catalogctl from tools/catalogctl
      dockerfile: ccp/scanner/Dockerfile
    image: ccp-scanner:local
    profiles: ["scanner"]
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 30s              # let an in-flight scan report a terminal status
    command:
      - --server
      - ${CCP_SCANNER_SERVER:-http://api:${PORT:-8801}}
      - --workdir
      - /workspace
      # OPS-12 — MUST match scanner/Dockerfile's HEALTHCHECK: that probe reads
      # this exact path back. compose's `command:` fully replaces the image's
      # default CMD, so it has to be repeated here rather than inherited.
      - --heartbeat
      - /workspace/.heartbeat
    environment:
      # The ONLY credential this container gets. Same value as the api's
      # CCP_SCANNER_KEY — it is the shared key for the /scan-jobs lane, and it
      # authorizes nothing else. Deliberately NOT given any cloud credential;
      # the worker refuses to start if it finds one.
      CCP_SCANNER_KEY: ${CCP_SCANNER_KEY:?set CCP_SCANNER_KEY in .env before enabling the scanner profile — the shared scanner-worker key, >=32 chars}
    read_only: true
    tmpfs:
      # Every checkout lives here and nowhere else. Size it for your largest
      # estate repo; a repository that will not fit is a failed job, not a full
      # host disk.
      - /workspace:size=${CCP_SCANNER_WORKSPACE_SIZE:-2g},mode=0700,uid=1000,gid=1000
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  # ── Toolbox (opt-in, profile: toolbox) ───────────────────────────────────────
  # Pinned Terraform + the built catalogctl, for armed-lane operator commands (see
  # docker-compose.armed.yml + ccp/docs/go-live.md → "Toolbox + armed lanes").
  # A run-on-demand image, not a daemon: the profile keeps it out of `up`;
  # `docker compose --profile toolbox build toolbox` builds it,
  # `docker compose run --rm toolbox …` or `docker run --rm ccp-toolbox:local …`
  # uses it. No healthcheck: `toolbox-selfcheck` (its default command, and what
  # doctor.sh invokes) IS the health proof — a long-running healthcheck is
  # meaningless for a one-shot tool image.
  toolbox:
    build:
      context: ..                       # repo root — builds catalogctl from tools/catalogctl
      dockerfile: ccp/toolbox/Dockerfile
    image: ccp-toolbox:local
    profiles: ["toolbox"]
    restart: "no"
    logging: *default-logging
    command: ["toolbox-selfcheck"]      # one-shot: prints terraform/catalogctl/git versions
