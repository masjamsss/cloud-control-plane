name: path-filters
# CI-3 — verifies that every workflow's `paths:` filter still mirrors the IMPORT GRAPH.
#
# NO PATH FILTER OF ITS OWN, deliberately. A check whose job is to catch an under-scoped
# path filter must not be gated by one: the PR that breaks the relationship is exactly the
# PR whose files a narrow filter would exclude, so the check would go quiet at the moment
# it was needed. This lane is seconds long, which is what makes running it on everything
# affordable.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  filters:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml
      - name: workflow path filters mirror the import graph
        run: bash scripts/ci/check-path-filters.sh
      # CI-4 — the apply-lane gates must keep a workflow consumer, and no shipped file may
      # point at a workflow that does not exist. Same reason this lane has no path filter:
      # the change that breaks either relationship is the change a narrow filter excludes.
      - name: shipped lanes have consumers and every workflow reference resolves
        run: bash scripts/ci/check-shipped-lanes.sh
      # CI-9 / CI-6 — gating and publishing invariants that span workflows: no job gated on
      # the runner override, nothing published from an unchecked commit, `latest` never
      # moved unconditionally. Same reason this lane has no path filter: a rule about all
      # workflows must run on every change, not only when a workflow file is edited.
      - name: workflow gating and publishing rules hold
        run: bash scripts/ci/check-workflow-safety.sh
