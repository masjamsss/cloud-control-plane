name: catalogctl
# CI-3 — the filter mirrors the IMPORT GRAPH, not the directory tree:
#   scripts/ci/**  — windowgate_test.go and plancheck_gate_test.go EXECUTE
#                    ../../scripts/ci/*.sh, so editing a gate script used to trigger no
#                    run of the tests that validate it.
#   catalog/**     — catalog/redaction-rules.json is the canonical copy of rules embedded
#                    into Go (internal/hclops/redact.go, "SYNC OBLIGATION: byte-identical")
#                    with a drift test that only ran on tools/catalogctl/** changes. A PR
#                    touching only the JSON could let the fail-closed redaction layers
#                    drift apart on main, undetected.
# Verified by scripts/ci/check-path-filters.sh.
on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/catalogctl/**', 'scripts/ci/**', 'catalog/**', '.github/workflows/catalogctl.yml']
  push:
    branches: [main]
    paths: ['tools/catalogctl/**', 'scripts/ci/**', 'catalog/**', '.github/workflows/catalogctl.yml']
defaults:
  run:
    working-directory: tools/catalogctl
permissions:
  contents: read

jobs:
  go:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/catalogctl/go.mod
          # CI-12 — setup-go enables module caching by default, keyed on a
          # cache-dependency-path; unset, it looks for go.sum at the repo ROOT, which
          # doesn't exist here (the module lives under tools/catalogctl/), so the
          # cache step warned and caching was silently ineffective every run.
          cache-dependency-path: tools/catalogctl/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt is canonical
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-canonical:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./...
      # The race detector is a separate step because it catches a class the plain
      # run cannot: a racy test fake was live on main and green under `go test`
      # for as long as the suite has existed, because nothing ever ran -race.
      - run: go test -race -count=1 ./...
      # Coverage floor. The suite sits at 93.5% of statements; the gate is set
      # just below so ordinary churn does not trip it, but a change that drops
      # real coverage fails instead of silently eroding it. Raise COVERAGE_FLOOR
      # when the number rises — never lower it to make a red build green.
      - name: coverage floor
        env:
          COVERAGE_FLOOR: '93.0'
        run: |
          go test -count=1 -coverprofile=cover.out -coverpkg=./... ./... >/dev/null
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}' | tr -d '%')
          echo "total statement coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN {
            if (t + 0 < f + 0) {
              printf "::error::coverage %.1f%% is below the %.1f%% floor\n", t, f; exit 1
            }
          }'
