name: release-images

# Builds and publishes the container images to GitHub Container Registry (GHCR)
# on every version tag (v*), and on demand via workflow_dispatch.
#
#   ghcr.io/masjamsss/cloud-control-plane/ccp-api       — the backend, fully generic
#                                                          (all configuration is runtime env;
#                                                          see ccp/api/README.md "Deploy").
#   ghcr.io/masjamsss/cloud-control-plane/ccp-app-demo  — the SPA in DEMO/mock mode.
#                                                          REAL deploys must build the app
#                                                          themselves: VITE_API_BASE is baked
#                                                          into the bundle at build time
#                                                          (ccp/app/Dockerfile header), so a
#                                                          generic prebuilt app image can only
#                                                          ever be the demo. docker-compose.yml
#                                                          builds the real one from source.
#   ghcr.io/masjamsss/cloud-control-plane/ccp-scanner   — the isolated repository scanner
#                                                          (opt-in, compose profile `scanner`).
#                                                          Fully generic like ccp-api: nothing
#                                                          is baked in, the control-plane URL
#                                                          and the shared key are runtime env.
#                                                          Published rather than left
#                                                          build-from-source because it is the
#                                                          one container that handles UNTRUSTED
#                                                          repositories, and what makes it safe
#                                                          is largely what it does NOT contain —
#                                                          a prebuilt, reproducible image is a
#                                                          claim an operator can verify instead
#                                                          of a local build they have to trust.
#
# NOT published, deliberately: ccp-toolbox and ccp-runner. Both are host-shaped conveniences
# (toolbox ships terraform for the armed lanes; runner registers against one repo), built from
# source by their compose profiles — see ccp/docker-compose.yml.
#
# Auth: the workflow's own GITHUB_TOKEN — no extra secrets. First publish creates the
# packages as private; make them public once in each package's settings.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp on the images (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  checks: read # CI-6 — preflight reads the tagged commit's check runs

# CI-6 — two tag pushes in flight at once raced each other to `latest` with no ordering.
# Never cancel a publish midway (a half-pushed manifest is worse than a slow one); just
# serialize them.
concurrency:
  group: release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ── CI-6 — nothing publishes until the commit being published has been checked ────────
  #
  # Before this, pushing a `v*` tag at ANY commit built and published immediately: no
  # `needs`, no check-suite condition, no branch restriction. A tag on an untested branch
  # head — or on a commit whose PR ran no test lane at all because path filters excluded it
  # (CI-3) — became the published `latest` through entirely normal use of the workflow.
  #
  # `gate` and `filters` are the two lanes deliberately built WITHOUT path filters, so they
  # run on every commit that went through CI. That makes them the honest required set: any
  # other lane's absence can legitimately mean "no files in its scope changed", but these
  # two missing means the commit was never checked at all.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.decide.outputs.is_latest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # needs every tag to decide whether this one is the newest
      - name: Validate the dispatch version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The input was free text stamped onto a published image from any ref. Nothing
          # checked it was a version at all, and nothing stopped it overwriting one.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' is not MAJOR.MINOR.PATCH — refusing to stamp it on an image"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists, so $VERSION has been released — re-dispatching would republish that version with different bytes. Cut a new version instead."
            exit 1
          fi
      - name: The commit being published passed its checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" --paginate \
                    --jq '.check_runs[] | "\(.name)\t\(.conclusion)"' || true)"
          if [ -z "$runs" ]; then
            echo "::error::no check runs on ${SHA} — this commit has never been tested, and publishing it would make an unchecked build the released image"
            exit 1
          fi
          echo "$runs"
          # A check that ran and failed blocks the release.
          if failed="$(printf '%s\n' "$runs" | awk -F'\t' '$2=="failure"||$2=="timed_out"||$2=="cancelled"{print $1}')" \
             && [ -n "$failed" ]; then
            echo "::error::these checks did not succeed on ${SHA}: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          # A check that is ABSENT is the CI-3 case and blocks it too — "no lane ran" must
          # never be indistinguishable from "every lane passed".
          for required in gate filters; do
            if ! printf '%s\n' "$runs" | awk -F'\t' -v r="$required" '$1==r{found=1} END{exit !found}'; then
              echo "::error::required check '$required' never ran on ${SHA}. Both lanes run on every commit by design, so their absence means this commit did not go through CI."
              exit 1
            fi
          done
      - name: Decide whether this release is the newest
        id: decide
        run: |
          set -euo pipefail
          # `latest` was applied unconditionally in all three jobs, so cutting a maintenance
          # release (v0.1.1 after v0.2.0) or re-running a dispatch build silently repointed
          # `latest` BACKWARDS. It now moves only when the tag being built is the highest
          # version tag in the repository — and never for a dispatch build, which is not a
          # release.
          is_latest=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            newest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [ "${GITHUB_REF_NAME}" = "$newest" ]; then
              is_latest=true
            else
              echo "${GITHUB_REF_NAME} is not the newest tag (${newest:-none}) — leaving \`latest\` where it is"
            fi
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "latest will be moved: $is_latest"

  api:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.IMAGE_BASE }}/ccp-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.is_latest == 'true' }}
      - name: Build and push ccp-api
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ccp
          file: ccp/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            ${{ steps.meta.outputs.labels }}

  scanner:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.IMAGE_BASE }}/ccp-scanner
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.is_latest == 'true' }}
      - name: Build and push ccp-scanner
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          # Repo ROOT, not ccp/ — the image builds catalogctl from tools/catalogctl
          # (same context docker-compose.yml gives it).
          context: .
          file: ccp/scanner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Isolated Terraform repository scanner — static HCL parsing only, ships no terraform and no cloud credentials
            ${{ steps.meta.outputs.labels }}

  app-demo:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.IMAGE_BASE }}/ccp-app-demo
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.is_latest == 'true' }}
      - name: Build and push ccp-app-demo (VITE_API_BASE empty => demo/mock bundle)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ccp/app
          file: ccp/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            ${{ steps.meta.outputs.labels }}
