name: publish-gate

# The publish-safety gate (scripts/publish-gate.sh) on every change: generic-patterns
# mode — the denylist file is deliberately absent in the public repo, so the gate runs
# its always-on generic backstop checks (account-id shapes, key-id shapes, secret-shaped
# assignments, private-path escapees, gitleaks, binary blobs). A private deployment
# strengthens the same script with its own untracked .estate-denylist.json.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gitleaks (PG-9)
        run: |
          set -euo pipefail
          # Retry the download. This step runs under `set -e`, so a single
          # transient blip fetching the release (a 5xx, a rate-limited 403, a
          # dropped connection) fails the WHOLE publish gate with no findings and
          # no useful log — observed exactly once, then passing unchanged on
          # re-run. A red gate should mean "the gate found something", never
          # "GitHub's CDN hiccuped", so the fetch retries before giving up.
          # The pin MUST be >= v8.19.0: the gate invokes `gitleaks dir`, and that
          # subcommand does not exist before v8.19.0. v8.18.4 was pinned here while the
          # script discarded gitleaks' output and never read its exit status, so PG-9
          # recorded PASS on every CI run without scanning a single file. The script now
          # fails loudly when the invocation fails, which makes a wrong pin here a red
          # gate rather than a silent one — but keep the two in step regardless.
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 180 -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          # Fail the step now, with a clear message, rather than letting a gitleaks that
          # cannot run reach PG-9 at all.
          gitleaks dir --help >/dev/null 2>&1 || {
            echo "::error::the pinned gitleaks has no 'dir' subcommand — PG-9 would scan nothing"; exit 1; }
      - name: PG-5 still catches the shapes people actually commit
        # Runs BEFORE the gate. CI-8: the pattern was blind to `ADMIN_PASSWORD=` — the most
        # common accidental-commit shape there is — and nothing anywhere probed it, so the
        # blindness was invisible for as long as it existed. These probes are what make the
        # heuristic's reach a checked property instead of a claim in a comment.
        run: bash scripts/ci/publish-gate-selftest.sh

      - name: Run publish gate (generic mode)
        # CI-8 — PUBLISH_GATE_REQUIRE_ALL=1 makes a missing gitleaks a RED gate here rather
        # than a skip. The install step above already fails loudly if the binary or its `dir`
        # subcommand is absent, so this is defence in depth — but it is the half that lives
        # in the SCRIPT, which is what an adopting estate actually runs. A deployment that
        # copies the gate without copying this workflow still gets the guarantee by setting
        # the variable; without it, PG-5's approximate heuristic would be the only secret
        # check standing, which is the collapse CI-8 describes.
        run: bash scripts/publish-gate.sh
        env:
          PUBLISH_GATE_REQUIRE_ALL: '1'
