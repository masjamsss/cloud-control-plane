name: docs-links
# DOC-5: keeps the published tree's own navigation working.
#
# A mechanical scan once found 122 relative markdown links resolving to nothing —
# private ADRs never published, runbooks promised and never written, citations into a
# planning archive this repo does not ship. None of it was caught because nothing was
# looking. This is the watcher.
#
# Runs on every change to a markdown file OR to the checker itself. Note the second
# half of that: a checker whose own edits are not gated is a checker that can be
# quietly defanged.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/docs-link-check.py'
      - 'scripts/docs-test-plan-citations-check.py'
      - 'scripts/docs-env-vars-check.py'
      - 'scripts/docs-error-codes-check.py'
      - 'scripts/docs-entity-catalog-check.py'
      - 'ccp/api/src/**/*.ts'
      - 'ccp/api/.env.example'
      - 'ccp/.env.example'
      - 'ccp/docker-compose.yml'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/docs-link-check.py'
      - 'scripts/docs-test-plan-citations-check.py'
      - 'scripts/docs-env-vars-check.py'
      - 'scripts/docs-error-codes-check.py'
      - 'scripts/docs-entity-catalog-check.py'
      - 'ccp/api/src/**/*.ts'
      - 'ccp/api/.env.example'
      - 'ccp/.env.example'
      - 'ccp/docker-compose.yml'
      - '.github/workflows/docs-links.yml'
permissions:
  contents: read

jobs:
  links:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Makes no network calls: it resolves relative paths against the checkout only.
      # It also asserts a floor on how many links it found, so a scan that silently
      # checked nothing fails instead of reporting a clean tree.
      - name: every relative markdown link resolves
        run: python3 scripts/docs-link-check.py
      # TEST-10 — every test-file citation in the functional test plan's "Automated?"
      # column resolves to a real file (catches the ADMIN-01/ADMIN-04 shape: a
      # plausible-looking path that names no file that has ever existed).
      - name: every FUNCTIONAL-TEST-PLAN.md citation resolves
        run: python3 scripts/docs-test-plan-citations-check.py
      # DOC-9 — every CCP_* env var the api reads is documented somewhere an
      # operator would look (catches the CCP_APPLY_FROZEN shape: a knob mentioned
      # in zero markdown/env-example/compose files, only in code comments).
      - name: every CCP_* env var is documented somewhere
        run: python3 scripts/docs-env-vars-check.py
      # DOC-10 — every error code errors.ts declares, and every inline
      # `c.json({code…})` literal a route emits, appears in ERROR-STATES.md's
      # "every error code the API can return" tables.
      - name: every API error code is documented
        run: python3 scripts/docs-error-codes-check.py
      # DOC-12 — every exported `*Item` store shape in schema.ts has a
      # DOMAIN-MODEL.md entity-catalog row.
      - name: every store item shape is catalogued
        run: python3 scripts/docs-entity-catalog-check.py
