name: gen-project-data-selftest

# ERR-16 — regression coverage for scripts/gen-project-data.sh's control-plane-
# unreachable handling (the `::warning::` annotation, the $GITHUB_STEP_SUMMARY
# block, and the opt-in CCP_DATA_REQUIRE_UPLOAD hard-fail). A dedicated
# workflow, not a job inside ccp-data.yml: that lane's generate-and-upload job
# is gated on `vars.CCP_PROJECT_ID != ''` (CI-9) and only triggers on push to
# main, so in this public template repo — which sets no CCP_PROJECT_ID —
# ccp-data.yml never runs at all. A regression in this behavior would only
# ever be caught by the first real deployment's outage, which is exactly the
# silent-failure class ERR-16 closes. This lane runs unconditionally on every
# PR/push that touches the script or the generators, using the SAME toolchain
# pins ccp-data.yml reads via --print-pins.

on:
  pull_request:
    paths:
      - 'scripts/gen-project-data.sh'
      - 'scripts/ci/gen-project-data-selftest.sh'
      - 'ccp/app/scripts/build-inventory.py'
      - 'ccp/app/scripts/extract-blocks.ts'
      - '.github/workflows/gen-project-data-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gen-project-data.sh'
      - 'scripts/ci/gen-project-data-selftest.sh'
      - 'ccp/app/scripts/build-inventory.py'
      - 'ccp/app/scripts/extract-blocks.ts'
      - '.github/workflows/gen-project-data-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read this repo's own toolchain pins
        id: pins
        run: bash scripts/gen-project-data.sh --print-pins >> "$GITHUB_OUTPUT"

      # Same action pins as ccp-data.yml (v6.3.0/v6.4.0, not the repo-wide
      # v5/v4) — see that workflow's header for why this one lane's interpreter
      # setup is governed by gen-project-data.sh's own pins.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "${{ steps.pins.outputs.python_series }}"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "${{ steps.pins.outputs.node_major }}"

      - name: gen-project-data.sh selftest (ERR-16)
        run: bash scripts/ci/gen-project-data-selftest.sh
