name: ccp-smoke

# The install-journey smoke: proves a fresh checkout still comes up as the REAL
# portal. run-local.sh --smoke builds the SPA in api-mode (VITE_API_BASE baked),
# boots ccp-api in PRODUCTION posture on a throwaway store (the fail-closed
# preflight runs for real), bootstraps the first admin, asserts /readyz == 200 and
# that the served bundle is not the mock build, then tears down. Guards the whole
# setup/run-local/install script surface, which no other workflow watches — installer
# bit-rot is how "easy installs" die. Local mirror: ./scripts/gate.sh smoke (or full).

on:
  workflow_dispatch:
  pull_request:
    # CI-13 — `ccp/**` includes `ccp/docs/**`, so a typo fix in a runbook spent a full
    # SPA build + api boot proving nothing about the install journey. Expressed as a
    # NEGATED pattern rather than `paths-ignore:`, because GitHub rejects a workflow
    # that sets both filters on one event — the obvious spelling is an invalid file.
    # Order is load-bearing: the negation must follow the positive it narrows, and the
    # workflow's own path follows the negation so editing this file still triggers it.
    paths:
      - 'ccp/**'
      - '!ccp/docs/**'
      - '.github/workflows/ccp-smoke.yml'
  push:
    branches: [main]
    # CI-10 — this list omitted the workflow's OWN file (present in the pull_request
    # list above, and in ccp-app.yml / catalogctl.yml's push lists too): a merge
    # touching only this file ran the PR-side validation but no post-merge run on
    # main. Same ordering rule as above — the negation must precede it.
    paths:
      - 'ccp/**'
      - '!ccp/docs/**'
      - '.github/workflows/ccp-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22' # api engines >=22; the app (>=20) builds fine on 22
          cache: npm
          cache-dependency-path: |
            ccp/api/package-lock.json
            ccp/app/package-lock.json
      - name: Install smoke (build + boot + /readyz + teardown)
        run: ccp/scripts/run-local.sh --smoke
